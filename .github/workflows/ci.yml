# Runs Dena's checks on Linux, Windows and macOS for every push to main and every pull request.
# It installs from scratch (including the native SQLite module), type-checks, tests and builds the
# web app, so a ✓ here means a fresh install works on that system.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # some tests read git history

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Tests make throwaway git repos and commits.
      - run: |
          git config --global user.name "Dena CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
